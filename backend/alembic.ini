# --------------------------------------------------------------------------
# Orion Agro API — Alembic (migrations de esquema)
#
# O DATABASE_URL vem de `config.settings` (12-factor / .env), NÃO deste arquivo,
# para evitar duplicar a configuração. Veja `backend/alembic/env.py`.
#
# Uso:
#   cd backend
#   alembic upgrade head          # aplica todas as revisões pendentes
#   alembic revision --autogenerate -m "msg"   # gera nova migração
#   alembic history               # histórico
#   alembic downgrade -1          # reverte 1
# --------------------------------------------------------------------------
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
